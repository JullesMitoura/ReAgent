# Build + test on every push to main and on version tags; publish to the Azure
# Artifacts npm feed only when the trigger is a "v*" tag (e.g. v0.2.1).
trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildAndTest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Use Node.js 22"
          - script: npm ci
            displayName: "Install dependencies (root + ui workspace)"
          - script: npm run typecheck
            displayName: "Typecheck"
          - script: npm test
            displayName: "Run tests"
          - script: npm run build:web && npm run build
            displayName: "Build (web UI + server)"

  - stage: Publish
    displayName: Publish to Azure Artifacts
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: PublishPackage
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Use Node.js 22"
          - script: npm ci
            displayName: "Install dependencies (root + ui workspace)"
          # npm publish runs the prepublishOnly script automatically
          # (npm run build:web && npm run build), so no separate build step here.
          - task: Npm@1
            displayName: "npm publish to the feed"
            inputs:
              command: publish
              publishRegistry: useFeed
              # TODO: replace with your feed's name (project-scoped feeds: "ProjectName/FeedName").
              publishFeed: "REPLACE_WITH_YOUR_FEED_NAME"